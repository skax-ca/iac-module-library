# 모듈 검증 CI — docs/06-conventions.md §6 "검증 게이트" 의 구현.
#
# ⚠️ 이 repo는 **배포하지 않는다.** apply 워크플로가 없는 것은 누락이 아니라 설계다(CLAUDE.md).
#    배포는 소비 repo(iac-reference-infra 등)의 몫이다.
#
# ⚠️ **로컬 게이트와 도구 버전·플래그를 정확히 일치시킨다**(로컬 훅: .githooks/{pre-commit,pre-push}).
#    기준: OpenTofu 1.12.5 · tflint 0.63.1 · trivy 0.72.0 · aws ruleset 0.48.0. 한쪽을 바꾸면 다른 쪽도 바꾼다.
name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CI는 읽기 전용이라 앞선 run을 취소해도 안전하다.
# ⚠️ 소비 repo의 **apply** 워크플로는 반대로 cancel-in-progress: false 여야 한다 —
#    apply 중단은 state 잠금·부분 적용을 남긴다. 이 블록을 그대로 복사하지 말 것.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOFU_VERSION: "1.12.5"
  TFLINT_VERSION: "v0.63.1"
  TRIVY_VERSION: "v0.72.0"
  # TF_PLUGIN_CACHE_DIR 은 여기 두지 않는다 — workflow 레벨 env: 는 runner 컨텍스트를 못 써서,
  # 게이트 4 앞 "provider 플러그인 캐시 준비" 스텝에서 설정한다.

jobs:
  verify:
    name: 공통 검증 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          # wrapper는 stdout을 가로채 후속 스텝의 grep을 깨뜨린다. 게이트에는 불필요하다.
          tofu_wrapper: false

      - name: "게이트 1/6 — tofu fmt"
        run: tofu fmt -recursive -check -diff

      - uses: terraform-linters/setup-tflint@v6.3.0
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: "게이트 2/6 — tflint"
        env:
          # 플러그인(aws ruleset 0.48.0)을 GitHub 릴리스에서 받는다 — 익명 호출은 rate limit 에 걸린다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init
          tflint --recursive

      - name: "게이트 3/6 — trivy config"
        run: |
          # trivy-action 대신 바이너리를 직접 설치한다 — 액션은 플래그를 자기 입력으로 번역해
          # 로컬 pre-commit 과 완전히 같은 명령을 만들 수 없다.
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          trivy --version
          # ↓ .githooks/pre-commit 의 명령과 한 글자도 다르지 않아야 한다
          # ⚠️ --ignorefile 생략 금지: trivy 0.72는 .trivyignore.yaml 을 자동 탐지하지 않는다.
          trivy config --quiet --exit-code 1 --severity MEDIUM,HIGH,CRITICAL \
            --skip-dirs '**/.terraform' --tf-exclude-downloaded-modules \
            --ignorefile .trivyignore.yaml .

      # provider 플러그인 캐시 — 게이트 4·5 가 5개 디렉토리(modules 3 + examples 2)에서 각자
      # init 을 돌아 provider 를 받는다. 캐시 없이 13회 받던 걸 5회로 줄인다.
      #
      # 도입 계기는 속도가 아니라 실패율이다 — provider 체크섬(SHA256SUMS) 조회 중 runner 의
      # TLS 인증서 검증이 일시적으로 실패해 init 이 죽은 사례가 있었다(재실행으로 통과). 왕복이
      # 13회면 같은 flake 에 13번 노출되므로 5회로 줄인다.
      #
      # 검토 후 기각한 대안: actions/cache(캐시가 커서 전송 비용이 이득을 넘고 새 실패 지점이
      # 됨), matrix 병렬화(이 캐시 디렉토리는 동시성 비안전 — job 이 1개·순차 루프라 지금은
      # 무관하나, matrix 로 쪼개면 재검토 필요).
      - name: "provider 플러그인 캐시 준비 (게이트 4·5 공용)"
        run: |
          set -euo pipefail
          # $RUNNER_TEMP 사용: workflow 레벨 env: 는 runner 컨텍스트를 못 쓰고, workspace 안에
          # 두면 전체 스캔 게이트(1·2·3·6)가 캐시까지 훑는다. 하드코딩 /tmp 금지 — runner마다 다르다.
          cache_dir="${RUNNER_TEMP}/tofu-plugin-cache"
          mkdir -p "$cache_dir"  # tofu가 자동 생성하지만, 그 동작이 바뀌어도 캐시가 조용히 꺼지지 않도록 명시
          echo "TF_PLUGIN_CACHE_DIR=${cache_dir}" >> "$GITHUB_ENV"  # provider 출처만 바꾼다 — 로컬 훅 parity 유지
          echo "TF_PLUGIN_CACHE_DIR=${cache_dir}"

      - name: "게이트 4/6 — modules: validate + test"
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for m in modules/*/; do
            found=1
            echo "::group::$m"
            # -lockfile=readonly: lock 이 config 와 다르면(갱신 필요 시) 여기서 실패한다 — 의도된 동작.
            tofu -chdir="$m" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$m" validate
            if [ -d "${m}tests" ]; then
              tofu -chdir="$m" test
            else
              echo "⚠️ ${m}tests 없음 — 계약 검증이 없는 모듈은 릴리스하지 않는다"
              exit 1
            fi
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "modules/ 가 비어 있다"; exit 1; }

      - name: "게이트 5/6 — examples: validate"
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for e in examples/*/; do
            # 최상위에 .tf 가 없는 디렉토리(문서 전용 등)는 예제가 아니므로 건너뛴다.
            [ -n "$(find "$e" -maxdepth 1 -name '*.tf' -print -quit 2>/dev/null)" ] || continue
            found=1
            echo "::group::$e"
            # 예제는 상대경로로 모듈을 소싱한다 — 외부 인증이 필요 없다.
            tofu -chdir="$e" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$e" validate
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "examples/ 에 검증할 .tf 가 하나도 없다"; exit 1; }

      - name: "게이트 6/6 — lock 파일 registry 검사"
        run: |
          set -euo pipefail
          # 06-conventions.md §3(lock 파일): lock 은 커밋 + registry.opentofu.org 여야 한다 —
          # 다른 스택(PoC)의 lock 을 복사하면 registry.terraform.io 가 섞여 들어온다.
          # $(find ...) 를 for 로 순회하면 경로의 공백에서 깨진다(그리고 zsh 에서는 아예 분할되지
          # 않아 로컬 검증이 조용히 무의미해진다). -print0 + read -d '' 로 고정한다.
          rc=0
          n=0
          while IFS= read -r -d '' f; do
            n=$((n + 1))
            if grep -qE 'provider "registry\.terraform\.io/' "$f"; then
              echo "::error file=$f::registry.terraform.io 참조 — registry.opentofu.org 여야 한다"
              rc=1
            else
              echo "  ✓ $f"
            fi
          done < <(find . -name '.terraform.lock.hcl' -not -path '*/.terraform/*' -print0)
          [ "$n" -gt 0 ] || { echo "::error::lock 파일이 하나도 없다"; exit 1; }
          echo "  검사한 lock: ${n}개"
          exit $rc

  # 약어 카탈로그는 데이터 SSOT — 문서 중 유일하게 코드 게이트가 있는 것.
  # 로컬 게이트는 .githooks/pre-commit (카탈로그 staged 시만). 한쪽을 바꾸면 다른 쪽도 바꾼다.
  docs-ssot:
    name: 약어 카탈로그 SSOT 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "게이트 — 약어 카탈로그 SSOT 일관성"
        run: python3 scripts/validate-abbreviations.py
