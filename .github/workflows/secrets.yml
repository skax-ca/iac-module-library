# secrets: 저장소 전체 이력을 gitleaks 규칙으로 본다. PR·main push 전부, 경로 필터 없이.
# 훅(.githooks/pre-commit)이 staged 내용을 커밋 전에 보고, 여기서는 훅이 꺼진 클론과 fork PR을 막는다.
# verify.yml·verify-docs.yml과 달리 경로 필터를 두지 않는다. 시크릿은 어느 파일에든 들어갈 수 있다.

name: secrets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "v8.30.1"

jobs:
  secrets:
    name: 시크릿 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # gitleaks git은 받아온 커밋만 본다. 전체 이력을 받아 옛 커밋에 든 것까지 본다.
          fetch-depth: 0

      - name: gitleaks
        run: |
          # gitleaks-action은 org 저장소에 라이선스 키(시크릿)를 요구한다. 시크릿 0을 지키려고
          # 바이너리를 직접 받는다. 훅(.githooks/pre-commit)과 같은 도구, 같은 버전이다.
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks git --redact --no-banner --exit-code 1 .
