# OpenTofu 검증 CI — docs/conventions.md 「검증 게이트」 의 구현. 문서·주석 검사기는 verify-docs.yml.
#
# ⚠️ 이 repo는 **배포하지 않는다.** apply 워크플로가 없는 것은 누락이 아니라 설계다(CLAUDE.md).
#    배포는 소비 repo(eks-reference-infra 등)의 몫이다.
#
# ⚠️ **로컬 게이트와 도구 버전·플래그를 정확히 일치시킨다**(로컬 훅: .githooks/{pre-commit,pre-push}).
#    기준: OpenTofu 1.12.5 · tflint 0.63.1 · trivy 0.72.0 · aws ruleset 0.48.0. 한쪽을 바꾸면 다른 쪽도 바꾼다.
name: verify

on:
  pull_request:
  push:
    branches: [main]
    # 게이트 7개의 입력이 바뀐 push 만 돈다. 허용 목록(paths)인 이유: 입력이 닫힌 집합이다 —
    # modules/**(.tf·tftest·tftpl·lock·README 는 terraform-docs 대상)와 도구 설정 2개, 그리고 게이트를
    # 정의하는 이 파일. modules/<provider>/<name>/ 모양은 게이트 4 앞 검사가 강제하므로 글롭이
    # 어긋날 여지가 없다. 확장자 패턴은 modules/ 밖에 .tf 가 생겼을 때의 가드다(지금은 없다).
    # ⚠️ 새 게이트가 modules/ 밖 파일을 읽게 되면 그 경로를 여기에 더한다. 빠뜨리면 그 파일만
    #    바뀐 push 는 CI 없이 main 에 들어간다. pull_request 에는 필터가 없다(PR 은 항상 전체).
    paths:
      - "modules/**"
      - ".tflint.hcl"
      - ".trivyignore.yaml"
      - ".github/workflows/verify.yml"
      - "**.tf"
      - "**.tftest.hcl"
      - "**.tftpl"
      - "**/.terraform.lock.hcl"
  workflow_dispatch:

# CI는 읽기 전용이라 앞선 run을 취소해도 안전하다.
# ⚠️ 소비 repo의 **apply** 워크플로는 반대로 cancel-in-progress: false 여야 한다 —
#    apply 중단은 state 잠금·부분 적용을 남긴다. 이 블록을 그대로 복사하지 말 것.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOFU_VERSION: "1.12.5"
  TFLINT_VERSION: "v0.63.1"
  TRIVY_VERSION: "v0.72.0"
  # TF_PLUGIN_CACHE_DIR 은 여기 두지 않는다 — workflow 레벨 env: 는 runner 컨텍스트를 못 써서,
  # 게이트 4 앞 "provider 플러그인 캐시 준비" 스텝에서 설정한다.

jobs:
  verify:
    name: OpenTofu 검증 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          # wrapper는 stdout을 가로채 후속 스텝의 grep을 깨뜨린다. 게이트에는 불필요하다.
          tofu_wrapper: false

      - name: "게이트 1/7 — tofu fmt"
        run: tofu fmt -recursive -check -diff

      - uses: terraform-linters/setup-tflint@v6.3.0
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: "게이트 2/7 — tflint"
        env:
          # 플러그인(aws ruleset 0.48.0)을 GitHub 릴리스에서 받는다 — 익명 호출은 rate limit 에 걸린다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init
          tflint --recursive

      - name: "게이트 3/7 — trivy config"
        run: |
          # trivy-action 대신 바이너리를 직접 설치한다 — 액션은 플래그를 자기 입력으로 번역해
          # 로컬 pre-commit 과 완전히 같은 명령을 만들 수 없다.
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          trivy --version
          # ↓ .githooks/pre-commit 의 명령과 한 글자도 다르지 않아야 한다
          # ⚠️ --ignorefile 생략 금지: trivy 0.72는 .trivyignore.yaml 을 자동 탐지하지 않는다.
          trivy config --quiet --exit-code 1 --severity MEDIUM,HIGH,CRITICAL \
            --skip-dirs '**/.terraform' --tf-exclude-downloaded-modules \
            --ignorefile .trivyignore.yaml .

      # provider 플러그인 캐시 — 게이트 4·5 가 6개 디렉토리(modules 4 + examples 2)에서 각자
      # init 을 돌아 provider 를 받는다. 캐시가 없으면 그 왕복이 디렉토리마다 반복된다.
      #
      # 도입 계기는 속도가 아니라 실패율이다 — provider 체크섬(SHA256SUMS) 조회 중 runner 의
      # TLS 인증서 검증이 일시적으로 실패해 init 이 죽은 사례가 있었다(재실행으로 통과). 캐시가
      # 왕복 횟수를 디렉토리 수만큼으로 줄여 같은 flake 노출을 줄인다.
      #
      # 검토 후 기각한 대안: actions/cache(캐시가 커서 전송 비용이 이득을 넘고 새 실패 지점이
      # 됨), matrix 병렬화(이 캐시 디렉토리는 동시성 비안전 — job 이 1개·순차 루프라 지금은
      # 무관하나, matrix 로 쪼개면 재검토 필요).
      - name: "provider 플러그인 캐시 준비 (게이트 4·5 공용)"
        run: |
          set -euo pipefail
          # $RUNNER_TEMP 사용: workflow 레벨 env: 는 runner 컨텍스트를 못 쓰고, workspace 안에
          # 두면 전체 스캔 게이트(1·2·3·6)가 캐시까지 훑는다. 하드코딩 /tmp 금지 — runner마다 다르다.
          cache_dir="${RUNNER_TEMP}/tofu-plugin-cache"
          mkdir -p "$cache_dir"  # tofu가 자동 생성하지만, 그 동작이 바뀌어도 캐시가 조용히 꺼지지 않도록 명시
          echo "TF_PLUGIN_CACHE_DIR=${cache_dir}" >> "$GITHUB_ENV"  # provider 출처만 바꾼다 — 로컬 훅 parity 유지
          echo "TF_PLUGIN_CACHE_DIR=${cache_dir}"

      # modules/ 아래는 반드시 `<provider>/<name>/` 형태다. 개수가 아니라 **모양**을 강제하므로
      # 게이트 4·5·7 의 글롭(modules/*/*/)이 어긋날 여지가 구조적으로 사라진다.
      # ⚠️ -mindepth/-maxdepth 는 -o 절마다 재적용되지 않는 global option 이라 단일 호출로 묶으면
      #    depth 1 의 stray 를 놓친다. 두 번 분리 호출해야 한다.
      # ⚠️ | head 를 붙이지 않는다 — 이 셸은 pipefail 이라 SIGPIPE 가 rc 를 오염시킨다.
      - name: "게이트 4/7 앞 — modules/ 트리 모양 검사"
        run: |
          set -euo pipefail
          stray=$( { find modules -mindepth 1 -maxdepth 1 -type f;
                     find modules -mindepth 2 -maxdepth 2 -name '*.tf'; } )
          [ -z "$stray" ] || { echo "::error::modules/<provider>/<name>/ 형태가 아닌 항목: $stray"; exit 1; }

      - name: "게이트 4/7 — modules: validate + test"
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for m in modules/*/*/; do
            found=1
            echo "::group::$m"
            # -lockfile=readonly: lock 이 config 와 다르면(갱신 필요 시) 여기서 실패한다 — 의도된 동작.
            tofu -chdir="$m" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$m" validate
            if [ -d "${m}tests" ]; then
              tofu -chdir="$m" test
            else
              echo "⚠️ ${m}tests 없음 — 계약 검증이 없는 모듈은 릴리스하지 않는다"
              exit 1
            fi
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "modules/ 가 비어 있다"; exit 1; }

      - name: "게이트 5/7 — examples: validate"
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for e in modules/*/*/examples/*/; do
            # 최상위에 .tf 가 없는 디렉토리(문서 전용 등)는 예제가 아니므로 건너뛴다.
            [ -n "$(find "$e" -maxdepth 1 -name '*.tf' -print -quit 2>/dev/null)" ] || continue
            found=1
            echo "::group::$e"
            # 예제는 상대경로로 모듈을 소싱한다 — 외부 인증이 필요 없다.
            tofu -chdir="$e" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$e" validate
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "modules/*/*/examples/ 에 검증할 .tf 가 하나도 없다"; exit 1; }

      - name: "게이트 6/7 — lock 파일 registry 검사"
        run: |
          set -euo pipefail
          # conventions.md §3(lock 파일): lock 은 커밋 + registry.opentofu.org 여야 한다 —
          # 다른 스택(PoC)의 lock 을 복사하면 registry.terraform.io 가 섞여 들어온다.
          # $(find ...) 를 for 로 순회하면 경로의 공백에서 깨진다(그리고 zsh 에서는 아예 분할되지
          # 않아 로컬 검증이 조용히 무의미해진다). -print0 + read -d '' 로 고정한다.
          rc=0
          n=0
          while IFS= read -r -d '' f; do
            n=$((n + 1))
            if grep -qE 'provider "registry\.terraform\.io/' "$f"; then
              echo "::error file=$f::registry.terraform.io 참조 — registry.opentofu.org 여야 한다"
              rc=1
            else
              echo "  ✓ $f"
            fi
          done < <(find . -name '.terraform.lock.hcl' -not -path '*/.terraform/*' -print0)
          [ "$n" -gt 0 ] || { echo "::error::lock 파일이 하나도 없다"; exit 1; }
          echo "  검사한 lock: ${n}개"
          exit $rc

      - name: "게이트 7/7 — terraform-docs drift 검사"
        run: |
          set -euo pipefail
          # terraform-docs version: v0.24.0
          curl -sSLo /tmp/terraform-docs.tar.gz \
            https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-$(uname -s | tr '[:upper:]' '[:lower:]')-amd64.tar.gz
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          chmod +x /tmp/terraform-docs
          for dir in modules/*/*/; do
            /tmp/terraform-docs markdown table --output-mode inject --output-check --output-file README.md "$dir"
          done
