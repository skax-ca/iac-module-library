# 문서·주석 검사 CI — 파이썬 검사기 3개. OpenTofu 게이트 7개는 verify.yml.
#
# verify.yml 과 파일을 가른 이유: GitHub Actions 는 job 별 경로 필터가 없어서, 한 파일에 두면
# docs/*.md 만 바뀐 push 에도 OpenTofu 게이트(3~4분)가 함께 돈다. 워크플로 레벨 필터는
# 파일 단위라, 입력이 다른 job 은 파일을 갈라야 따로 걸러진다.
#
# 세 job 의 로컬 게이트는 .githooks/pre-commit(대상이 staged 됐을 때만). 한쪽을 바꾸면 다른 쪽도
# 바꾼다. CI 는 전체 저장소를 본다(로컬은 staged 파일만 — 속도 차이).
name: verify-docs

on:
  pull_request:
  push:
    branches: [main]
    # 어느 검사기도 보지 않는 경로만 바뀐 push 는 돌리지 않는다. verify.yml 과 달리 제외 목록인
    # 이유: 검사기 대상이 넓은 글롭(docs/**·**/README.md)이라 허용 목록은 검사기가 대상을 늘릴 때
    # 같이 고치지 않으면 새 대상이 조용히 CI 밖에 남는다. 제외 목록은 그 방향의 드리프트가 없고,
    # 세 job 합쳐 20초라 더 좁혀 얻을 것도 없다.
    # ⚠️ 두 검사기의 default_targets() 는 python glob('**') 라 dot 디렉토리를 보지 않는다.
    #    검사기에 include_hidden 을 켜거나, 검사 대상 파일을 이 경로들 아래에 두면 그 파일은
    #    CI 밖에서 바뀐다. 그때는 이 목록부터 다시 본다. pull_request 에는 필터가 없다.
    paths-ignore:
      - ".claude/**"
      - ".mcp.json"
  workflow_dispatch:

# 읽기 전용이라 앞선 run 을 취소해도 안전하다.
concurrency:
  group: verify-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 약어 카탈로그는 데이터 SSOT — 문서 중 유일하게 코드 게이트가 있는 것.
  docs-ssot:
    name: 약어 카탈로그 SSOT 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "게이트 — 약어 카탈로그 SSOT 일관성"
        run: python3 scripts/validate-abbreviations.py docs/naming/abbreviations/*.md

  # 문서 작성 규칙(docs/conventions.md 문서 작성 규칙 절)의 기계 판정 가능한 3개(§N 인용·
  # 비표준 이모지·400줄 초과).
  docs-conventions:
    name: 문서 작성 규칙 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "게이트 — §N 인용·비표준 이모지·400줄 제한"
        run: python3 scripts/validate-doc-conventions.py

  # 주석·description 의 주석 규칙(docs/conventions.md 코드 규약 절) 중 기계 판정 가능한 3개.
  # 외부 참조 2종(절 번호 인용 기호·결정 식별자)과 이력 서술 1종(날짜). 대상 목록의 SSOT 는
  # 스크립트의 default_targets() 이고 여기서 인자를 주지 않는다.
  comment-conventions:
    name: 주석 규칙 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "게이트: 외부 참조·이력 서술"
        run: python3 scripts/validate-comment-conventions.py
